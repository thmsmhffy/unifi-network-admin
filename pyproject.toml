[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unifi-network-admin"
version = "0.1.0"
description = "Read-only UniFi Network discovery for humans and AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["unifi", "mcp", "agent-skill", "networking"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking",
]
dependencies = [
  "httpx>=0.27,<1",
  "keyring>=25,<27",
  "mcp>=2.3,<3",
  "platformdirs>=4,<5",
  "pydantic>=2.8,<3",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "anyio>=4.4,<5",
  "build>=1.2,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<8",
  "pyyaml>=6,<7",
  "ruff>=0.8,<1",
  "setuptools>=77,<82",
  "wheel>=0.45,<1",
]

[project.scripts]
unifi-admin = "unifi_network_admin.cli:app"
unifi-admin-mcp = "unifi_network_admin.mcp_server:main"

[project.urls]
Homepage = "https://github.com/thmsmhffy/unifi-network-admin"
Repository = "https://github.com/thmsmhffy/unifi-network-admin"
Issues = "https://github.com/thmsmhffy/unifi-network-admin/issues"
Security = "https://github.com/thmsmhffy/unifi-network-admin/security/policy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/unifi-network-admin/docs" = ["docs/*.md"]
"share/unifi-network-admin/skill/unifi-network-admin" = ["skill/unifi-network-admin/SKILL.md"]
"share/unifi-network-admin/skill/unifi-network-admin/agents" = ["skill/unifi-network-admin/agents/*.yaml"]
"share/unifi-network-admin/skill/unifi-network-admin/references" = ["skill/unifi-network-admin/references/*.md"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: requires a live UniFi test environment",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-third-party = ["build"]
